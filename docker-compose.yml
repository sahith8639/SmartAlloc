version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:6.0
    container_name: smartalloc_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smartalloc_network

  # Node.js backend API and telemetry generator service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartalloc_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/smart_resource_allocator
      - JWT_SECRET=supersecret_key_for_os_resource_allocator_123
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - smartalloc_network

  # React frontend application served by Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartalloc_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartalloc_network

networks:
  smartalloc_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
